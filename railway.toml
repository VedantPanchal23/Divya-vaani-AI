[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# IMPORTANT: Attach a Railway volume mounted at /app/storage
# Do NOT mount at /app/data — that contains Python package files!
# Railway Dashboard -> Service -> Settings -> Volumes -> Mount Path: /app/storage
